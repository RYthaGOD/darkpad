[package]
name = "launchpad"
version = "0.1.0"
description = "Darkpool Launchpad - Private Sealed-Bid Auction with Noir ZK Proofs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
verifier = { path = "../verifier", features = ["cpi"] }
